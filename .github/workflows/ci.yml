name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS (Core Audio backend, full test suite)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Debug)
        run: cmake --preset debug -DLAVANDA_BUILD_COREAUDIO_BACKEND=ON

      - name: Build (Debug)
        run: cmake --build --preset debug

      - name: Test (Debug)
        run: ctest --preset debug

      - name: Configure (Release)
        run: cmake --preset release -DLAVANDA_BUILD_COREAUDIO_BACKEND=ON

      - name: Build (Release)
        run: cmake --build --preset release

      - name: Test (Release)
        run: ctest --preset release

  linux-core-only:
    name: Linux (platform-independent core, no backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Debug)
        run: cmake --preset debug

      - name: Build (Debug)
        run: cmake --build --preset debug

      - name: Test (Debug)
        run: ctest --preset debug
